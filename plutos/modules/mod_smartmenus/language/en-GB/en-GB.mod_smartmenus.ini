MOD_SMARTMENUS="Smart Menus"
MOD_SMARTMENUS_FIELD_ACTIVE_DESC="Select a menu item to always be used as the base for the menu display. You must set the Start Level to the same level or higher than the level of the base item. This will cause the module to be displayed on all assigned pages. If Current is selected the active item is used as the base. This causes the module to only display when the parent menu item is active."
MOD_SMARTMENUS_FIELD_ACTIVE_LABEL="Base Item"
MOD_SMARTMENUS_FIELD_ALLCHILDREN_DESC="Expand the menu and make its sub-menu items always visible."
MOD_SMARTMENUS_FIELD_ALLCHILDREN_LABEL="Show Sub-menu Items"
MOD_SMARTMENUS_FIELD_CLASS_DESC="A suffix to be applied to the CSS class of the menu items."
MOD_SMARTMENUS_FIELD_CLASS_LABEL="Menu Class Suffix"

MOD_SMARTMENUS_FIELD_JUSTIFY_CONTENT_LABEL="Justify content"
MOD_SMARTMENUS_FIELD_JUSTIFY_CONTENT_DESC="Use justify-content utilities on flexbox containers to change the alignment of flex items on the main axis (the x-axis to start, y-axis if flex-direction: column). Choose from start (browser default), end, center, between, or around."

MOD_SMARTMENUS_FIELD_DIRECTION_LABEL="Direction"
MOD_SMARTMENUS_FIELD_DIRECTION_DESC="RTL (Right to Left) - LTR (Left to Right):creating the text and content for your website that supports both RTL and LTR layouts. (When we write in most languages, including English, we write from left to right. Much like this paragraph. But, several other languages in different countries, including Arabic, Urdu, Hebrew, Persian, and a few others, are written right to left.)"
DIRECTION_LTR="LTR (Left to Right)"
DIRECTION_RTL="RTL (Right to Left)"

MOD_SMARTMENUS_FIELD_ENDLEVEL_DESC="Level to stop rendering the menu at. If you choose 'All', all levels will be shown depending on 'Show Sub-menu Items' setting."
MOD_SMARTMENUS_FIELD_ENDLEVEL_LABEL="End Level"
MOD_SMARTMENUS_FIELD_MENUTYPE_DESC="Select a menu in the list."
MOD_SMARTMENUS_FIELD_MENUTYPE_LABEL="Select Menu"
MOD_SMARTMENUS_FIELD_STARTLEVEL_DESC="Level to start rendering the menu at. Setting the start and end levels to the same # and setting 'Show Sub-menu Items' to yes will only display that single level."
MOD_SMARTMENUS_FIELD_STARTLEVEL_LABEL="Start Level"

